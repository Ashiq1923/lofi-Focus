<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lofi Focus</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --glass-bg: rgba(255, 255, 255, 0.14);
  --glass-border: rgba(255, 255, 255, 0.28);
  --glass-blur: 18px;
  --text-primary: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.72);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
}

html, body {
  height: 100%;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text-primary);
  overflow-x: hidden;
}

/* ---------- Dynamic Background ---------- */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: -2;
  background-size: cover;
  background-position: center;
  transition: background 1.5s ease-in-out;
}

.bg-overlay {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.45));
}

.theme-morning  { background: linear-gradient(135deg, #a1c4fd, #c2e9fb), url('https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1600&q=80'); }
.theme-afternoon{ background: linear-gradient(135deg, #56ccf2, #2f80ed), url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=80'); }
.theme-sunset   { background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb), url('https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?auto=format&fit=crop&w=1600&q=80'); }
.theme-night    { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364), url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=80'); }

/* ---------- Glassmorphism base ---------- */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  box-shadow: var(--shadow);
}

/* ---------- Layout ---------- */
.app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(14px, 4vw, 24px) clamp(12px, 4vw, 20px) clamp(30px, 8vw, 60px);
  width: 100%;
}

.topbar {
  width: 100%;
  max-width: 1100px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: clamp(10px, 2.5vw, 14px) clamp(14px, 4vw, 24px);
  margin-bottom: clamp(16px, 4vw, 28px);
  gap: 8px;
  flex-wrap: wrap;
}

.brand { font-size: clamp(0.95rem, 3vw, 1.1rem); font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; }
.daypart { font-size: clamp(0.75rem, 2.2vw, 0.9rem); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }

.workspace {
  width: 100%;
  max-width: 1100px;
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: clamp(16px, 3vw, 28px);
  align-items: start;
}

.panel { padding: clamp(18px, 4.5vw, 28px); min-width: 0; }

/* ---------- Timer Panel ---------- */
.timer-panel { display: flex; flex-direction: column; align-items: center; }

.mode-switch {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  background: rgba(255,255,255,0.08);
  padding: 6px;
  border-radius: 14px;
  margin-bottom: clamp(18px, 4vw, 26px);
  max-width: 100%;
}

.mode-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  padding: 8px clamp(8px, 2.5vw, 14px);
  border-radius: 10px;
  cursor: pointer;
  font-size: clamp(0.72rem, 2.2vw, 0.85rem);
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.25s ease;
}
.mode-btn.active {
  background: rgba(255,255,255,0.25);
  color: #fff;
}

.timer-ring-wrap {
  position: relative;
  width: clamp(150px, 50vw, 220px);
  height: clamp(150px, 50vw, 220px);
  margin-bottom: clamp(18px, 4vw, 26px);
}

.timer-ring { width: 100%; height: 100%; transform: rotate(-90deg); }

.ring-bg {
  fill: none;
  stroke: rgba(255,255,255,0.15);
  stroke-width: 10;
}
.ring-progress {
  fill: none;
  stroke: #ffffff;
  stroke-width: 10;
  stroke-linecap: round;
  stroke-dasharray: 628;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear;
}

.timer-display {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(1.7rem, 8vw, 2.6rem);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.timer-controls { display: flex; gap: clamp(10px, 3vw, 16px); align-items: center; margin-bottom: 18px; }

.ctrl-btn {
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.12);
  color: #fff;
  border-radius: 50%;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s ease, background 0.2s ease;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.22); transform: scale(1.06); }
.ctrl-btn.small { width: clamp(38px, 10vw, 46px); height: clamp(38px, 10vw, 46px); font-size: clamp(0.95rem, 3vw, 1.1rem); }
.ctrl-btn.primary { width: clamp(54px, 14vw, 64px); height: clamp(54px, 14vw, 64px); font-size: clamp(1.25rem, 4vw, 1.5rem); }

.session-count { color: var(--text-secondary); font-size: 0.85rem; }

/* ---------- Side column ---------- */
.side-column { display: flex; flex-direction: column; gap: clamp(16px, 4vw, 24px); min-width: 0; }

.panel-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-weight: 600;
  margin-bottom: clamp(12px, 3vw, 18px);
  font-size: 1rem;
}

.master-btn {
  background: rgba(255,255,255,0.18);
  border: 1px solid var(--glass-border);
  color: #fff;
  padding: 6px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.8rem;
  white-space: nowrap;
  transition: background 0.2s ease;
}
.master-btn:hover { background: rgba(255,255,255,0.3); }

/* Mixer rows */
.mixer-list { display: flex; flex-direction: column; gap: clamp(12px, 3vw, 16px); }

.mixer-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.sound-toggle {
  width: clamp(38px, 10vw, 42px);
  height: clamp(38px, 10vw, 42px);
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 1.2rem;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease;
}
.sound-toggle.active { background: rgba(255,255,255,0.35); }

.mixer-info { flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.mixer-name { font-size: 0.85rem; font-weight: 600; }

.mixer-url-row {
  display: flex;
  gap: 8px;
  width: 100%;
  margin-top: 6px;
}

.mixer-url-input {
  flex: 1;
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  color: #fff;
  padding: 6px 10px;
  font-size: 0.75rem;
  min-width: 0;
}

.mixer-url-input::placeholder {
  color: rgba(255,255,255,0.5);
}

.mixer-url-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid var(--glass-border);
  color: #fff;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.75rem;
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
  transition: background 0.2s ease;
}

.mixer-url-btn:hover {
  background: rgba(255,255,255,0.32);
}

.mixer-source-link {
  font-size: 0.68rem;
  color: var(--text-secondary);
  text-decoration: none;
  width: fit-content;
}
.mixer-source-link:hover { color: #fff; text-decoration: underline; }

.import-btn {
  width: clamp(38px, 10vw, 42px);
  height: clamp(38px, 10vw, 42px);
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 1rem;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease;
}
.import-btn:hover { background: rgba(255,255,255,0.25); }
.import-btn.imported { background: rgba(120, 220, 150, 0.35); border-color: rgba(120,220,150,0.5); }

.mixer-row.needs-url { flex-wrap: wrap; }
.mixer-row.needs-url .mixer-name { color: rgba(255,255,255,0.6); }

.custom-url-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
  margin-top: 8px;
}
.custom-url-input {
  flex: 1 1 140px;
  min-width: 0;
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  color: #fff;
  padding: 6px 10px;
  font-size: 0.75rem;
}
.custom-url-input::placeholder { color: rgba(255,255,255,0.5); }
.custom-url-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid var(--glass-border);
  color: #fff;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.75rem;
  cursor: pointer;
  flex-shrink: 0;
}
.custom-url-btn:hover { background: rgba(255,255,255,0.32); }

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 4px;
  background: rgba(255,255,255,0.25);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 0 4px rgba(0,0,0,0.3);
}
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; border: none; cursor: pointer;
}

/* ---------- Stats ---------- */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(10px, 3vw, 14px); margin-bottom: 16px; }

.stat-box {
  background: rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: clamp(12px, 3vw, 16px);
  text-align: center;
  min-width: 0;
}
.stat-value { font-size: clamp(1.4rem, 5vw, 1.8rem); font-weight: 700; }
.stat-label { font-size: clamp(0.65rem, 2vw, 0.75rem); color: var(--text-secondary); margin-top: 4px; }

.reset-stats-btn {
  width: 100%;
  background: transparent;
  border: 1px solid var(--glass-border);
  color: var(--text-secondary);
  padding: 8px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s ease;
}
.reset-stats-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

/* ---------- Responsive ---------- */

/* Large desktop: give the layout more breathing room */
@media (min-width: 1400px) {
  .topbar, .workspace { max-width: 1280px; }
}

/* Tablet and below: stack timer above mixer/stats */
@media (max-width: 860px) {
  .workspace { grid-template-columns: 1fr; }
  .timer-panel { max-width: 480px; margin: 0 auto; width: 100%; }
  .side-column { max-width: 480px; margin: 0 auto; width: 100%; }
}

/* Phones */
@media (max-width: 480px) {
  .topbar { flex-direction: column; gap: 6px; text-align: center; }
  .panel { border-radius: 16px; }
  .timer-controls { gap: 12px; }
}

/* Small phones */
@media (max-width: 360px) {
  .app { padding-left: 10px; padding-right: 10px; }
  .mode-switch { gap: 4px; }
  .mode-btn { padding: 7px 8px; }
  .stats-grid { grid-template-columns: 1fr; }
  .master-btn { font-size: 0.72rem; padding: 5px 10px; }
}

/* Short/landscape screens (phone rotated, small laptops in a split view) */
@media (max-height: 560px) and (orientation: landscape) {
  .app { padding-top: 10px; padding-bottom: 20px; }
  .topbar { margin-bottom: 12px; padding: 8px 16px; }
  .workspace { grid-template-columns: 1fr 1fr; align-items: stretch; }
  .timer-ring-wrap { width: clamp(120px, 22vh, 170px); height: clamp(120px, 22vh, 170px); margin-bottom: 12px; }
  .mode-switch { margin-bottom: 12px; }
  .timer-controls { margin-bottom: 8px; }
  .side-column { gap: 12px; }
}

/* Fine pointer devices (mouse) get slightly larger hover targets; touch
   devices keep comfortable tap sizing already set via clamp() above */
@media (hover: none) {
  .ctrl-btn:hover, .sound-toggle:hover, .master-btn:hover, .mode-btn:hover {
    transform: none;
  }
}
</style>
</head>
<body>

  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-overlay"></div>

  <main class="app">

    <header class="topbar glass">
      <div class="brand">🎧 Lofi Focus</div>
      <div class="daypart" id="daypartLabel">Morning</div>
    </header>

    <section class="workspace">

      <!-- Pomodoro Timer -->
      <div class="panel timer-panel glass">
        <div class="mode-switch">
          <button class="mode-btn active" data-mode="work">Work</button>
          <button class="mode-btn" data-mode="short">Short Break</button>
          <button class="mode-btn" data-mode="long">Long Break</button>
        </div>

        <div class="timer-ring-wrap">
          <svg class="timer-ring" viewBox="0 0 220 220">
            <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
            <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100"></circle>
          </svg>
          <div class="timer-display" id="timerDisplay">25:00</div>
        </div>

        <div class="timer-controls">
          <button id="resetBtn" class="ctrl-btn small" title="Reset">⟲</button>
          <button id="playPauseBtn" class="ctrl-btn primary" title="Play/Pause">▶</button>
          <button id="skipBtn" class="ctrl-btn small" title="Skip">⏭</button>
        </div>

        <div class="session-count" id="sessionCount">Session 1 of 4</div>
      </div>

      <div class="side-column">
        <!-- Audio Mixer -->
        <div class="panel mixer-panel glass">
          <div class="panel-title">
            <span>Ambient Mixer</span>
            <button id="masterPlayBtn" class="master-btn">▶ Play All</button>
          </div>

          <div class="mixer-list" id="mixerList"></div>
        </div>

        <!-- Stats -->
        <div class="panel stats-panel glass">
          <div class="panel-title"><span>Your Progress</span></div>
          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-value" id="statMinutes">0</div>
              <div class="stat-label">Focused Minutes</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="statSessions">0</div>
              <div class="stat-label">Sessions Done</div>
            </div>
          </div>
          <button id="resetStatsBtn" class="reset-stats-btn">Reset Stats</button>
        </div>
      </div>

    </section>
  </main>

<script>
'use strict';

/* =========================================================
   1. DYNAMIC TIME-OF-DAY BACKGROUND
   ========================================================= */
function applyTimeTheme() {
  const hour = new Date().getHours();
  const bgLayer = document.getElementById('bgLayer');
  const label = document.getElementById('daypartLabel');

  let theme, text;
  if (hour >= 5 && hour < 11) { theme = 'theme-morning'; text = 'Morning'; }
  else if (hour >= 11 && hour < 17) { theme = 'theme-afternoon'; text = 'Afternoon'; }
  else if (hour >= 17 && hour < 20) { theme = 'theme-sunset'; text = 'Sunset'; }
  else { theme = 'theme-night'; text = 'Night'; }

  bgLayer.className = 'bg-layer ' + theme;
  label.textContent = text;
}
applyTimeTheme();
setInterval(applyTimeTheme, 10 * 60 * 1000);

/* =========================================================
   2. POMODORO TIMER
   ========================================================= */
const MODES = {
  work:  { label: 'Work',        minutes: 25 },
  short: { label: 'Short Break', minutes: 5  },
  long:  { label: 'Long Break',  minutes: 15 }
};

let currentMode = 'work';
let totalSeconds = MODES[currentMode].minutes * 60;
let secondsLeft = totalSeconds;
let timerInterval = null;
let isRunning = false;
let sessionsCompleted = 0;

const timerDisplay   = document.getElementById('timerDisplay');
const playPauseBtn   = document.getElementById('playPauseBtn');
const resetBtn       = document.getElementById('resetBtn');
const skipBtn        = document.getElementById('skipBtn');
const sessionCountEl = document.getElementById('sessionCount');
const ringProgress   = document.getElementById('ringProgress');
const modeBtns       = document.querySelectorAll('.mode-btn');

const RING_CIRCUMFERENCE = 2 * Math.PI * 100;
ringProgress.style.strokeDasharray = RING_CIRCUMFERENCE;

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function updateDisplay() {
  timerDisplay.textContent = formatTime(secondsLeft);

  const progress = 1 - secondsLeft / totalSeconds;
  ringProgress.style.strokeDashoffset = RING_CIRCUMFERENCE * progress;

  const modeEmoji = currentMode === 'work' ? '🎯' : '☕';
  document.title = isRunning
    ? `${modeEmoji} ${formatTime(secondsLeft)} — Lofi Focus`
    : 'Lofi Focus';

  sessionCountEl.textContent = `Session ${(sessionsCompleted % 4) + 1} of 4`;
}

function switchMode(mode) {
  currentMode = mode;
  totalSeconds = MODES[mode].minutes * 60;
  secondsLeft = totalSeconds;

  modeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));

  pauseTimer();
  updateDisplay();
}

function tick() {
  secondsLeft--;

  if (secondsLeft < 0) {
    handleSessionComplete();
    return;
  }
  updateDisplay();
}

function handleSessionComplete() {
  pauseTimer();

  if (currentMode === 'work') {
    logCompletedSession(MODES.work.minutes);
    sessionsCompleted++;
    const nextMode = sessionsCompleted % 4 === 0 ? 'long' : 'short';
    switchMode(nextMode);
  } else {
    switchMode('work');
  }

  playChime();
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1.2);
  } catch (e) {
    // Web Audio API unavailable — fail silently
  }
}

function startTimer() {
  if (isRunning) return;
  isRunning = true;
  playPauseBtn.textContent = '⏸';
  timerInterval = setInterval(tick, 1000);
}

function pauseTimer() {
  isRunning = false;
  playPauseBtn.textContent = '▶';
  clearInterval(timerInterval);
  document.title = 'Lofi Focus';
}

function resetTimer() {
  pauseTimer();
  secondsLeft = totalSeconds;
  updateDisplay();
}

playPauseBtn.addEventListener('click', () => {
  isRunning ? pauseTimer() : startTimer();
});
resetBtn.addEventListener('click', resetTimer);
skipBtn.addEventListener('click', handleSessionComplete);

modeBtns.forEach(btn => {
  btn.addEventListener('click', () => switchMode(btn.dataset.mode));
});

updateDisplay();

/* =========================================================
   3. AUDIO MIXER
   ========================================================= */
// NOTE: the previous version used .ogg files, which iOS Safari cannot play
// at all (silent failure -> "unavailable"). Every sound below now tries MP3
// sources first (universally supported), with an .ogg fallback, and if every
// automated source fails, the row gets a manual "paste a link" input so the
// user is never stuck — no code edits required.
const SOUNDS = [
  {
    id: 'lofi', name: 'Lofi Beats', icon: '🎵',
    urls: [
      'https://archive.org/download/kalaido-hanging-lanterns_202101/Kalaido%20-%20Hanging%20Lanterns.mp3',
      'https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg'
    ]
  },
  {
    id: 'rain', name: 'Rain', icon: '🌧️',
    urls: [
      'https://archive.org/download/RainSounds_201708/heavyrainloop.mp3',
      'https://archive.org/download/RainSounds_201708/rain.ogg'
    ]
  },
  {
    id: 'forest', name: 'Forest', icon: '🌲',
    urls: [
      'https://archive.org/download/ForestSounds/forest.mp3',
      'https://actions.google.com/sounds/v1/ambiences/spring_day_forest.ogg'
    ]
  },
  {
    id: 'cafe', name: 'Cafe', icon: '☕',
    urls: [
      'https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg',
      'https://archive.org/download/coffee-shop-sounds-12/Coffee%20Shop%20Sounds%2016.mp3'
    ]
  }
];

const mixerList = document.getElementById('mixerList');
const masterPlayBtn = document.getElementById('masterPlayBtn');
const audioElements = {};

function markUnavailable(sound) {
  const row = document.getElementById(`row-${sound.id}`);
  if (!row) return;
  row.querySelector('.mixer-name').textContent = `${sound.name} (unavailable)`;
  row.classList.add('needs-url');

  // Manual escape hatch: let the user paste any direct audio link (mp3/ogg/wav)
  // to fix this sound themselves, instantly, without touching code.
  if (row.querySelector('.custom-url-row')) return; // already added
  const fixRow = document.createElement('div');
  fixRow.className = 'custom-url-row';
  fixRow.innerHTML = `
    <input type="text" class="custom-url-input" placeholder="Paste a direct audio URL (.mp3)" data-id="${sound.id}">
    <button class="custom-url-btn" data-id="${sound.id}">Load</button>
  `;
  row.appendChild(fixRow);
}

function tryLoadSound(sound, urlIndex) {
  const entry = audioElements[sound.id];
  const url = sound.urls[urlIndex];

  if (!url) {
    markUnavailable(sound);
    return;
  }

  const audio = entry ? entry.audio : new Audio();
  audio.loop = true;
  if (!entry) {
    audio.volume = 0.5;
    audioElements[sound.id] = { audio, active: false, objectUrl: null };
  }

  // Replace error handler each attempt so it points at the next fallback
  audio.oncanplaythrough = () => updateSourceLink(sound, url);
  audio.onerror = () => tryLoadSound(sound, urlIndex + 1);
  audio.preload = 'auto';
  audio.src = url;
  audio.load();
}

function updateSourceLink(sound, url) {
  const link = document.getElementById(`source-${sound.id}`);
  if (!link) return;
  link.href = url;
  link.textContent = 'source ↗';
  link.style.display = '';
}

SOUNDS.forEach(sound => {
  const row = document.createElement('div');
  row.className = 'mixer-row';
  row.id = `row-${sound.id}`;
  row.innerHTML = `
    <button class="sound-toggle" data-id="${sound.id}">${sound.icon}</button>
    <div class="mixer-info">
      <span class="mixer-name">${sound.name}</span>
      <input type="range" min="0" max="100" value="50" data-id="${sound.id}">
      <div class="mixer-url-row" id="url-row-${sound.id}">
        <input type="text" class="mixer-url-input" 
               placeholder="Audio URL (mp3/ogg)" 
               data-id="${sound.id}">
        <button class="mixer-url-btn" data-id="${sound.id}">Load</button>
      </div>
    </div>
    <button class="import-btn" data-id="${sound.id}" title="Import your own audio file">📂</button>
    <input type="file" class="file-input" data-id="${sound.id}" accept="audio/*,video/*" hidden>
  `;
  mixerList.appendChild(row);

  tryLoadSound(sound, 0);
});

// Import a sound from the user's own device (Files app, gallery, downloads, etc.)
mixerList.addEventListener('click', (e) => {
  const importBtn = e.target.closest('.import-btn');
  if (!importBtn) return;
  const id = importBtn.dataset.id;
  document.querySelector(`.file-input[data-id="${id}"]`).click();
});

mixerList.addEventListener('change', (e) => {
  if (!e.target.classList.contains('file-input')) return;
  const file = e.target.files[0];
  if (!file) return;

  const id = e.target.dataset.id;
  const sound = SOUNDS.find(s => s.id === id);
  const entry = audioElements[id];
  const row = document.getElementById(`row-${id}`);

  // Free the previous blob URL (if any) before creating a new one
  if (entry.objectUrl) URL.revokeObjectURL(entry.objectUrl);
  const objectUrl = URL.createObjectURL(file);
  entry.objectUrl = objectUrl;

  entry.audio.onerror = null; // stop the URL-fallback chain — this is now user-supplied
  entry.audio.loop = true;
  entry.audio.src = objectUrl;
  entry.audio.load();

  row.classList.remove('needs-url');
  row.querySelector('.custom-url-row')?.remove();
  row.querySelector('.mixer-name').textContent = file.name.replace(/\.[^/.]+$/, '');

  const link = document.getElementById(`source-${id}`);
  link.textContent = '📱 from your device';
  link.removeAttribute('href');
  link.style.display = '';
  link.style.pointerEvents = 'none';

  document.querySelector(`.import-btn[data-id="${id}"]`).classList.add('imported');
});

// Manual "load your own URL" — works for URL input box
mixerList.addEventListener('click', (e) => {
  const urlBtn = e.target.closest('.mixer-url-btn');
  if (!urlBtn) return;

  const id = urlBtn.dataset.id;
  const row = document.getElementById(`row-${id}`);
  const input = row.querySelector('.mixer-url-input');
  const url = input.value.trim();
  if (!url) return;

  const sound = SOUNDS.find(s => s.id === id);
  const entry = audioElements[id];
  entry.audio.onerror = () => {
    input.placeholder = 'That link failed — try another URL';
    input.value = '';
  };
  entry.audio.oncanplaythrough = () => {
    input.style.borderColor = '#78dc96';
    input.placeholder = 'Audio loaded! ✓';
  };
  entry.audio.loop = true;
  entry.audio.src = url;
  entry.audio.load();

  row.querySelector('.mixer-name').textContent = sound.name;
});

// Legacy custom-url-btn support (fallback for unavailable sounds)
mixerList.addEventListener('click', (e) => {
  const fixBtn = e.target.closest('.custom-url-btn');
  if (!fixBtn) return;

  const id = fixBtn.dataset.id;
  const row = document.getElementById(`row-${id}`);
  const input = row.querySelector('.custom-url-input');
  const url = input.value.trim();
  if (!url) return;

  const sound = SOUNDS.find(s => s.id === id);
  const entry = audioElements[id];
  entry.audio.onerror = () => {
    input.placeholder = 'That link failed too — try another URL';
    input.value = '';
  };
  entry.audio.oncanplaythrough = () => updateSourceLink(sound, url);
  entry.audio.loop = true;
  entry.audio.src = url;
  entry.audio.load();

  row.classList.remove('needs-url');
  row.querySelector('.mixer-name').textContent = sound.name;
  row.querySelector('.custom-url-row')?.remove();
  document.querySelector(`.import-btn[data-id="${id}"]`)?.classList.remove('imported');
});

mixerList.addEventListener('click', (e) => {
  const btn = e.target.closest('.sound-toggle');
  if (!btn) return;

  const id = btn.dataset.id;
  const entry = audioElements[id];
  entry.active = !entry.active;
  btn.classList.toggle('active', entry.active);

  if (entry.active) {
    entry.audio.play().catch(() => {
      entry.active = false;
      btn.classList.remove('active');
    });
  } else {
    entry.audio.pause();
  }

  updateMasterButtonState();
});

mixerList.addEventListener('input', (e) => {
  if (e.target.type !== 'range') return;
  const id = e.target.dataset.id;
  audioElements[id].audio.volume = e.target.value / 100;
});

function updateMasterButtonState() {
  const anyActive = Object.values(audioElements).some(e => e.active);
  masterPlayBtn.textContent = anyActive ? '⏸ Pause All' : '▶ Play All';
}

masterPlayBtn.addEventListener('click', () => {
  const anyActive = Object.values(audioElements).some(e => e.active);

  if (anyActive) {
    Object.entries(audioElements).forEach(([id, entry]) => {
      entry.audio.pause();
      entry.active = false;
      document.querySelector(`.sound-toggle[data-id="${id}"]`).classList.remove('active');
    });
  } else {
    Object.entries(audioElements).forEach(([id, entry]) => {
      entry.audio.play().then(() => {
        entry.active = true;
        document.querySelector(`.sound-toggle[data-id="${id}"]`).classList.add('active');
      }).catch(() => { /* blocked by browser — ignore this one */ });
    });
  }

  updateMasterButtonState();
});

/* =========================================================
   4. STATS & LOCALSTORAGE PERSISTENCE
   ========================================================= */
const STORAGE_KEY = 'lofiFocusStats';

const statMinutesEl  = document.getElementById('statMinutes');
const statSessionsEl = document.getElementById('statSessions');
const resetStatsBtn  = document.getElementById('resetStatsBtn');

function loadStats() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return { totalMinutes: 0, totalSessions: 0 };
  try {
    return JSON.parse(raw);
  } catch {
    return { totalMinutes: 0, totalSessions: 0 };
  }
}

function saveStats(stats) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
}

function renderStats(stats) {
  statMinutesEl.textContent = stats.totalMinutes;
  statSessionsEl.textContent = stats.totalSessions;
}

function logCompletedSession(minutes) {
  const stats = loadStats();
  stats.totalMinutes += minutes;
  stats.totalSessions += 1;
  saveStats(stats);
  renderStats(stats);
}

resetStatsBtn.addEventListener('click', () => {
  const fresh = { totalMinutes: 0, totalSessions: 0 };
  saveStats(fresh);
  renderStats(fresh);
});

renderStats(loadStats());
</script>
